services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fabrirent
      POSTGRES_PASSWORD: fabrirent_dev
      POSTGRES_DB: fabrirent
    ports:
      - "5432:5432"
    volumes:
      - fabrirent_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabrirent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      # NEXT_PUBLIC_* vars must be passed as build args, not just runtime
      # environment - Next.js inlines them into the client bundle at
      # `next build` time. See Dockerfile.
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://fabrirent:fabrirent_dev@db:5432/fabrirent?schema=public"
      AUTH_SECRET: "${AUTH_SECRET:?set AUTH_SECRET in .env - generate with: openssl rand -base64 32}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      SMS_PROVIDER_API_KEY: "${SMS_PROVIDER_API_KEY:-}"
      EMAIL_PROVIDER_API_KEY: "${EMAIL_PROVIDER_API_KEY:-}"
      AI_VISION_API_KEY: "${AI_VISION_API_KEY:-}"
      ARUBA_SDI_API_KEY: "${ARUBA_SDI_API_KEY:-}"
      ARUBA_SDI_ENDPOINT: "${ARUBA_SDI_ENDPOINT:-}"
      PLATE_LOOKUP_API_KEY: "${PLATE_LOOKUP_API_KEY:-}"
      PLATE_LOOKUP_ENDPOINT: "${PLATE_LOOKUP_ENDPOINT:-}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}"
      SUMUP_CLIENT_ID: "${SUMUP_CLIENT_ID:-}"
      SUMUP_CLIENT_SECRET: "${SUMUP_CLIENT_SECRET:-}"
      SUMUP_MERCHANT_CODE: "${SUMUP_MERCHANT_CODE:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      REDIS_URL: "${REDIS_URL:-}"
      LOG_LEVEL: "${LOG_LEVEL:-}"

volumes:
  fabrirent_db_data:
